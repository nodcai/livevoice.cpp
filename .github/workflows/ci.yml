name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DLIVEVOICE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        # Tests that need a model are skipped here (exit 77).
        run: ctest --test-dir build --output-on-failure

  model:
    name: end-to-end tests with the published model
    runs-on: ubuntu-latest
    needs: build
    env:
      LIVEVOICE_MODEL: ${{ github.workspace }}/models/livevoice-0.5b-COMPACT.gguf
      LIVEVOICE_VOICE: ${{ github.workspace }}/models/voices/en-Clarissa_female.gguf
      LIVEVOICE_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: models
          key: models-livevoice-0.5b-COMPACT-en-Clarissa_female
      - name: Download model and voice
        run: |
          set -e
          base=https://huggingface.co/nodcai/livevoice-0.5b-gguf/resolve/main
          mkdir -p models/voices
          [ -f "$LIVEVOICE_MODEL" ] || curl -fsSL -o "$LIVEVOICE_MODEL" $base/livevoice-0.5b-COMPACT.gguf
          [ -f "$LIVEVOICE_VOICE" ] || curl -fsSL -o "$LIVEVOICE_VOICE" $base/voices/en-Clarissa_female.gguf
      - name: Build
        run: |
          cmake -B build -DLIVEVOICE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Synthesize
        run: ./build/bin/livevoice-cli --model "$LIVEVOICE_MODEL" --voice "$LIVEVOICE_VOICE" --text "Hello from the CI." --stream --seed 1 --out ci.wav
      - uses: actions/upload-artifact@v4
        with:
          name: ci-wav
          path: ci.wav
